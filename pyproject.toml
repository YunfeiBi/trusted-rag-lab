[project]
name = "trusted-rag-lab"
version = "0.1.0"
description = "Zhixu: knowledge management and collaboration for university research teams"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy",
  "psycopg[binary]",
  "pgvector",
  "pydantic-settings",
  "httpx",
  "python-multipart",
  "pypdf[crypto]",
  "jieba",
  "numpy",
  "alembic",
  "python-dotenv",
]

[dependency-groups]
dev = ["pytest", "ruff", "websockets"]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 120
